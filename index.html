<!doctype html>
<html lang="tr">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ev Arıyorum 🏠</title>
<style>
body{margin:0;background:#faf7f1;color:#18312a;font-family:system-ui,sans-serif}.wrap{max-width:1280px;margin:auto;padding:48px 22px}h1{font-size:clamp(3rem,8vw,6.5rem);margin:0}.eyebrow{color:#e76f51;font-weight:800;letter-spacing:.12em}.intro{font-size:1.25rem;max-width:620px}.pill{display:inline-block;background:#fff;padding:12px 18px;border-radius:99px;box-shadow:0 5px 20px #0001}input{width:min(480px,100%);box-sizing:border-box;padding:14px;margin:24px 0;border:1px solid #ddd;border-radius:12px;font:inherit}table{width:100%;border-collapse:collapse;background:#fff;font-size:14px}th{background:#264653;color:#fff;text-align:left}th,td{padding:11px 9px;border-bottom:1px solid #eee;vertical-align:top}a{color:#d9573f;font-weight:750}@media(max-width:760px){.optional{display:none}table{font-size:12px}th,td{padding:8px 5px}}
</style>
<main class="wrap"><p class="eyebrow">KİRALIK EV MACERASI</p><h1>Ev Arıyorum 🏠</h1><p class="intro">Favori ilanlarım. Bu sefer gerçekten taşınıyorum… galiba.</p><span class="pill" id="count">Yükleniyor</span><br><input id="q" placeholder="Mahalle, oda, site veya fiyat ara"><table><thead><tr><th>#</th><th>İlan</th><th>Fiyat</th><th>Mahalle</th><th class="optional">m²</th><th>Oda</th><th>Link</th></tr></thead><tbody id="rows"></tbody></table></main>
<script>
fetch('ilanlar.md').then(r=>r.text()).then(t=>{const d=t.split('\n').filter(x=>x.startsWith('|')&&!x.includes('---')).slice(1).map(x=>x.split('|').slice(1,-1).map(y=>y.trim())).map(x=>({n:x[0],mahalle:x[1],ilan:x[2],fiyat:x[3],m2:x[4],oda:x[5],link:(x[11].match(/\((.+)\)/)||[])[1]||'#'}));const rows=document.querySelector('#rows'),q=document.querySelector('#q');document.querySelector('#count').textContent=d.length+' aktif ilan';function draw(){const s=q.value.toLowerCase();rows.innerHTML=d.filter(x=>Object.values(x).join(' ').toLowerCase().includes(s)).map(x=>'<tr><td>'+x.n+'</td><td>'+x.ilan+'</td><td><b>'+x.fiyat+'</b></td><td>'+x.mahalle+'</td><td class="optional">'+x.m2+'</td><td>'+x.oda+'</td><td><a target="_blank" href="'+x.link+'">İlana git ↗</a></td></tr>').join('')}q.oninput=draw;draw()});
</script>
</html>
