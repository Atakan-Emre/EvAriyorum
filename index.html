<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ev Arıyorum 🏠</title><style>body{margin:0;background:#faf7f1;color:#19332c;font-family:system-ui}.wrap{max-width:1400px;margin:auto;padding:28px}h1{font:700 clamp(2.8rem,7vw,6rem) Georgia;margin:8px 0}.eyebrow{color:#d9624b;font-weight:800;letter-spacing:.12em}.hero{padding:30px 38px;border-radius:24px;background:#17483e;color:#fff}.hero p{font-size:18px}.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:20px 0}.badge{background:#fff;border-radius:999px;padding:11px 16px;font-weight:700}input{margin-left:auto;padding:12px 16px;border:1px solid #ddd;border-radius:12px;font:inherit;width:min(400px,100%)}.table-wrap{overflow:auto;border-radius:16px;background:#fff;box-shadow:0 8px 30px #0001}table{width:100%;border-collapse:collapse;min-width:1000px;font-size:14px}th{background:#17483e;color:#fff;text-align:left;font-size:12px;letter-spacing:.04em}th,td{padding:13px 11px;border-bottom:1px solid #eee;vertical-align:top}tr:hover td{background:#fff8e9}.price{font-weight:800;white-space:nowrap}.tag{background:#e6f0b7;border-radius:999px;padding:4px 8px;white-space:nowrap}a{color:#d9624b;font-weight:800;text-decoration:none}@media(max-width:700px){.wrap{padding:14px}.hero{padding:24px}.hero p{font-size:15px}input{margin:0;width:100%}}</style><main class="wrap"><section class="hero"><span class="eyebrow">KİRALIK EV MACERASI</span><h1>Ev Arıyorum 🏠</h1><p>Favori ilanlarım. Bu sefer gerçekten taşınıyorum… galiba.</p></section><div class="bar"><span class="badge" id="count">Yükleniyor</span><span class="badge">Fiyata göre artan</span><input id="q" placeholder="Mahalle, oda, site veya fiyat ara…"></div><div class="table-wrap"><table><thead><tr><th>#</th><th>İlan</th><th>Fiyat</th><th>Mahalle</th><th>Brüt / Net m²</th><th>Oda</th><th>Eşya</th><th>Aidat</th><th>Depozito</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>fetch('ilanlar.md').then(r=>r.text()).then(t=>{const d=t.split('\n').filter(x=>x.startsWith('|')&&!x.includes('---')).slice(1).map(x=>x.split('|').slice(1,-1).map(y=>y.trim())).map(x=>({n:x[0],mahalle:x[1],ilan:x[2],fiyat:x[3],m2:x[4],oda:x[5],esya:x[8],aidat:x[10],depozito:x[11],link:(x[12].match(/\((.+)\)/)||[])[1]||'#'}));const rows=document.querySelector('#rows'),q=document.querySelector('#q');document.querySelector('#count').textContent=d.length+' aktif ilan';function draw(){const s=q.value.toLowerCase();rows.innerHTML=d.filter(x=>Object.values(x).join(' ').toLowerCase().includes(s)).map(x=>'<tr><td>'+x.n+'</td><td><a href="'+x.link+'" target="_blank">'+x.ilan+'</a></td><td class="price">'+x.fiyat+'</td><td><span class="tag">'+x.mahalle+'</span></td><td>'+x.m2+'</td><td>'+x.oda+'</td><td>'+x.esya+'</td><td>'+x.aidat+'</td><td>'+x.depozito+'</td></tr>').join('')}q.oninput=draw;draw()});</script></html>
