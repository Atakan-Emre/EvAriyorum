<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ev Arıyorum 🏠</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono&family=Fraunces:opsz,wght@9..144,700&display=swap');*{box-sizing:border-box}body{margin:0;background:#fbf5e9;color:#18332c;font-family:system-ui}.wrap{max-width:1320px;margin:auto;padding:26px}.hero{position:relative;overflow:hidden;min-height:300px;padding:45px;border-radius:30px;background:#17483e;color:#fff}.hero:after{content:'';position:absolute;width:340px;height:340px;right:-90px;top:-110px;border:18px solid #f7bc5f;border-radius:50%}.eyebrow{font:12px 'DM Mono';letter-spacing:.15em;color:#f7bc5f}h1{font:700 clamp(3rem,8vw,7rem) Fraunces;margin:12px 0}.hero p{font-size:18px;max-width:510px}.house{position:absolute;right:90px;bottom:35px;width:230px;z-index:1}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.chip,input{border:0;border-radius:999px;padding:12px 16px;background:#fff;box-shadow:0 5px 20px #17332c12;font:14px system-ui}.chip{cursor:pointer}.chip.on{background:#ee7958;color:#fff}input{min-width:230px;margin-left:auto}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.stat{padding:12px 17px;border-radius:15px;background:#fff}.stat b{display:block;font-size:22px}table{width:100%;border-collapse:separate;border-spacing:0 8px}th{font:11px 'DM Mono';letter-spacing:.07em;text-align:left;padding:0 10px}td{padding:14px 10px;background:#fff}td:first-child{border-radius:14px 0 0 14px}td:last-child{border-radius:0 14px 14px 0}a{font-weight:800;color:#d95e45;text-decoration:none}.price{font-weight:800}.tag{background:#e7f0b6;border-radius:999px;padding:4px 8px;font-size:12px}@media(max-width:760px){.hide{display:none}.hero{padding:32px 24px}.house{opacity:.2;right:-35px}input{margin:0;width:100%}td,th{padding:9px 6px;font-size:12px}}</style>
<main class="wrap"><section class="hero"><span class="eyebrow">KİRALIK EV MACERASI / 2026</span><h1>Ev Arıyorum<br>🏠</h1><p>Favori ilanlarım. Bu sefer gerçekten taşınıyorum… galiba.</p><svg class="house" viewBox="0 0 240 180"><path fill="#f7bc5f" d="M20 95 120 10l100 85v70H20z"/><path fill="#ee7958" d="M95 100h48v65H95z"/><path fill="#fff" d="M45 105h28v28H45zm122 0h28v28h-28z"/></svg></section><div class="stats"><div class="stat"><b id="count">—</b>aktif ilan</div><div class="stat"><b id="lowest">—</b>en düşük kira</div></div><div class="toolbar"><button class="chip on" data-f="">Tümü</button><button class="chip" data-f="Eşyalı">Eşyalı</button><button class="chip" data-f="1+1">1+1</button><button class="chip" data-f="2+1">2+1</button><input id="q" placeholder="Mahalle, oda, site veya fiyat ara…"></div><div id="rows" class="cards"></div></main><script>
fetch('ilanlar.md').then(r=>r.text()).then(t=>{const d=t.split('\n').filter(x=>x.startsWith('|')&&!x.includes('---')).slice(1).map(x=>x.split('|').slice(1,-1).map(y=>y.trim())).map(x=>({n:x[0],mahalle:x[1],ilan:x[2],fiyat:x[3],m2:x[4],oda:x[5],aidat:x[9],depozito:x[10],link:(x[11].match(/\((.+)\)/)||[])[1]||'#'}));let f='';const rows=document.querySelector('#rows'),q=document.querySelector('#q');document.querySelector('#count').textContent=d.length;document.querySelector('#lowest').textContent=d[0]?.fiyat||'—';function draw(){let s=q.value.toLowerCase();rows.innerHTML=d.filter(x=>Object.values(x).join(' ').toLowerCase().includes(s)&&(f===''||Object.values(x).join(' ').includes(f))).map(x=>'<article class="card"><div><span class="tag">'+x.mahalle+'</span><b class="price">'+x.fiyat+'</b></div><h2>'+x.ilan+'</h2><p>'+x.m2+' · '+x.oda+'</p><div class="details"><span>🧾 Aidat <b>'+x.aidat+'</b></span><span>🔐 Depozito <b>'+x.depozito+'</b></span></div><a target="_blank" href="'+x.link+'">İlana git ↗</a></article>').join('')}q.oninput=draw;document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{f=b.dataset.f;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');draw()});draw()});
</script></html>
